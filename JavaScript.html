<script>
let KE=['Ulaşım','Konaklama','Yemek & İçecek','Alışveriş','Aktivite','Hizmet','Diğer'];
let KH=['Kira','Aidat','Kredi Kartı 1','Kredi Kartı 2','Kredi Kartı 3','Kredi Kartı 4','Kredi','Diğer'],KT=['Kira','Faturalar','Market','Ulaşım','Restoran','Alışveriş','Eğlence','Sağlık','Abonelik','Borç / Kredi','Diğer'],KG=['Kişi 1','Kişi 2','Maaş','Prim','Ek Gelir'],G=[],R=[],USER={ad:''};
let PB=['TL','USD','EUR'],KUR={};const SYM={TL:'₺',USD:'$',EUR:'€'};
let D=[],view='home',selM=null,selY='',selC='',F=null;
const $=s=>document.querySelector(s);
const nf=new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',minimumFractionDigits:0,maximumFractionDigits:2});
const fmt=n=>nf.format(n);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ml=k=>{const[y,m]=k.split('-');return new Date(y,m-1,1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'})};
const dl=t=>{const[y,m,d]=t.split('-');return new Date(y,m-1,d).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const curM=()=>today().slice(0,7);
const run=(fn,...a)=>new Promise((ok,er)=>google.script.run.withSuccessHandler(ok).withFailureHandler(er)[fn](...a));
function undoToast(msg,fn){
 const e=$('#toast');e.innerHTML=`<span>${esc(msg)}</span><button class="ub" id="ub">Geri al</button>`;e.style.display='flex';
 clearTimeout(toast.t);$('#ub').onclick=async()=>{clearTimeout(toast.t);e.style.display='none';try{await fn()}catch(er){toast('Geri alınamadı')}};
 toast.t=setTimeout(()=>e.style.display='none',6500)}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
const catsOf=(b,v)=>[...b,...new Set(v.filter(c=>c&&!b.includes(c)))];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let THEME=null;try{THEME=localStorage.getItem('tema')}catch(e){}
const isDark=()=>document.documentElement.dataset.theme==='dark';
function applyTheme(){const d=THEME?THEME==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=d?'dark':'light'}
function toggleTheme(){THEME=isDark()?'light':'dark';try{localStorage.setItem('tema',THEME)}catch(e){}applyTheme();render()}
const themeIcon=()=>isDark()?'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
applyTheme();
// --- önceki ayla karşılaştırma ---
const pk=k=>{const d=new Date(+k.slice(0,4),+k.slice(5,7)-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const dAmt=d=>(d>0?'+':d<0?'−':'')+fmt(Math.abs(d));
function dChip(c,p,good){
 if(!p&&!c)return '<span class="dl">—</span>';
 if(!p)return '<span class="dl">Önceki ay yok</span>';
 const d=c-p,pc=Math.round(Math.abs(d)/p*100),up=d>0;
 return `<span class="dl ${d===0?'':(up===good?'ok':'bad')}">${d===0?'Değişmedi':(up?'▲':'▼')+' %'+pc}</span>`}
function cmpLine(k){const c=stats(k).t,p=stats(pk(k)).t;if(!c&&!p)return '';return `<div class="cmpl">Geçen aya göre ${dChip(c,p,false)}${p?`<span>${dAmt(c-p)}</span>`:''}</div>`}
function cmpH(k){
 const q=pk(k),cu=stats(k),pr=stats(q),inM=m=>G.filter(x=>x.tarih.slice(0,7)===m),gc=sum(inM(k)),gp=sum(inM(q));
 const by=a=>{const o={};a.forEach(x=>o[x.kategori]=(o[x.kategori]||0)+x.tutar);return o},cc=by(cu.a),pc=by(pr.a);
 const mv=[...new Set(Object.keys(cc).concat(Object.keys(pc)))].map(n=>[n,cc[n]||0,pc[n]||0]).filter(m=>m[1]!==m[2]).sort((a,b)=>Math.abs(b[1]-b[2])-Math.abs(a[1]-a[2])).slice(0,4);
 const tile=(n,c,p,good)=>`<div style="background:var(--bg)"><small>${n}</small><b>${fmt(c)}</b><div style="margin-top:2px">${dChip(c,p,good)} <small style="display:inline">${p?dAmt(c-p):''}</small></div><small>Geçen ay: ${fmt(p)}</small></div>`;
 return `<div class="card" style="margin-top:12px"><h3>Geçen aya göre <span style="text-transform:capitalize;color:var(--mut);font-weight:600">· ${ml(q)}</span></h3><div class="g4" style="margin-bottom:6px">${tile('Gider',cu.t,pr.t,false)}${tile('Gelir',gc,gp,true)}</div>${mv.length?mv.map(([n,c,p])=>`<div class="mv"><span>${esc(n)}</span><small>${fmt(p)} → ${fmt(c)}</small><b style="color:${c>p?'var(--bad)':'var(--ok)'}">${dAmt(c-p)}</b></div>`).join(''):'<div class="empty" style="padding:12px">Karşılaştırılacak kategori verisi yok.</div>'}</div>`}
let appIn=true;const NEW=new Set(),BV={};
function countUp(){const el=document.querySelector('.hero .big[data-v]');if(!el)return;const key=view+(typeof ES==='string'?ES:''),to=+el.dataset.v,from=key in BV?BV[key]:0;BV[key]=to;if(RM||from===to)return;
 const t0=performance.now(),d=800;(function f(t){const p=Math.min((t-t0)/d,1),e=1-Math.pow(1-p,3);el.textContent=p<1?fmt(Math.round(from+(to-from)*e)):fmt(to);if(p<1)requestAnimationFrame(f)})(t0)}
function bump(id){const el=document.getElementById(id);if(!el||RM||!el.animate)return;const c=id==='fab-g'?'46,158,107':'232,163,23';
 el.animate([{transform:'scale(1)',boxShadow:`0 0 0 0 rgba(${c},.55)`},{transform:'scale(1.28)',boxShadow:`0 0 0 0 rgba(${c},.55)`,offset:.3},{transform:'scale(.94)',boxShadow:`0 0 0 20px rgba(${c},0)`,offset:.65},{transform:'scale(1)',boxShadow:`0 0 0 20px rgba(${c},0)`}],{duration:650,easing:'ease-out'})}
function fabTap(el,fn){
 if(!RM&&el.animate){el.animate([{transform:'scale(1)'},{transform:'scale(.82)',offset:.35},{transform:'scale(1.12)',offset:.7},{transform:'scale(1)'}],{duration:320,easing:'ease-out'});
  const s=el.querySelector('svg');if(s&&s.animate)s.animate([{transform:'rotate(0)'},{transform:'rotate(-16deg) scale(1.18)',offset:.5},{transform:'rotate(0)'}],{duration:320})}
 fn()}
const H=()=>D.filter(x=>!x.tk);
const sum=a=>a.reduce((s,x)=>s+x.tutar,0);
function statsOf(a){const p=sum(a.filter(x=>x.odendi)),t=sum(a);return{a,t,p,u:t-p}}
function stats(k){return statsOf(H().filter(x=>x.tarih.slice(0,7)===k))}
const DVR=/\s*\[([^\]]*×[^\]]*)\]\s*$/;
function rowH(x){const m=DVR.exec(x.aciklama||''),ad=m?x.aciklama.replace(DVR,''):x.aciklama,dv=m?m[1]:'';return `<div class="row ${x.odendi?'paid':''}${NEW.has(x.id)?' new':''}" data-id="${x.id}"><button class="chk" data-chk="${x.id}" aria-label="Ödendi">${x.odendi?'✓':''}</button><div class="t"><b>${esc(ad||x.kategori)}</b><small>${dv?esc(dv)+' · ':''}${esc(x.kategori)} · ${dl(x.tarih)}${x.tk?' · '+x.no+'/'+x.top+'. taksit':''}${x.rec?' · ↻':''}${x.ekleyen?' · '+esc(x.ekleyen):''}</small></div><div class="a">${fmt(x.tutar)}</div></div>`}
function heroH(k,s,cnt,gel){const r=s.t?Math.round(s.p/s.t*100):0;return `<div class="hero"><div class="m">${/^\d{4}-\d{2}$/.test(k)?ml(k):esc(k)}</div><div class="sub" style="display:block"><small style="opacity:.65;font-size:12px">Toplam gider</small></div><div class="big" data-v="${s.t}">${fmt(s.t)}</div><div class="bar"><i style="width:${r}%"></i></div><div class="sub"><div class="p"><small>Ödenen</small><b>${fmt(s.p)}</b></div><div class="u"><small>Ödenmemiş</small><b>${fmt(s.u)}</b></div>${cnt!=null?`<div><small>Gider</small><b>${cnt}</b></div>`:''}${gel!=null?`<div><small>Gelir</small><b style="color:#7BE0AE">${fmt(gel)}</b></div>`:''}</div></div>`}
let pieAnim=true;
const PC=['#3F8F83','#2E9E6B','#E8A317','#C8493B','#4F8FBF','#8E6BB8','#D96F9A','#7BC8A4','#E8845A','#9AA5A1','#5B6B67'];
function pieH(a){
 const t=sum(a);
 if(!t)return '<div class="card" style="margin-top:12px"><h3>Kategoriye göre dağılım</h3><div class="empty">Bu ay henüz gider yok.</div></div>';
 const m={};a.forEach(x=>m[x.kategori]=(m[x.kategori]||0)+x.tutar);
 const e=Object.entries(m).sort((x,y)=>y[1]-x[1]),R=40,C=2*Math.PI*R;
 const an=pieAnim&&!matchMedia('(prefers-reduced-motion: reduce)').matches;pieAnim=false;
 let off=0;
 const seg=e.map(([n,v],i)=>{const sh=v/t*C,l=Math.max(sh-(e.length>1?1.5:0),.5),s=off;off+=sh;
  return `<circle cx="60" cy="60" r="${R}" stroke="${PC[i%PC.length]}" data-l="${l}" data-c="${C}" style="stroke-dasharray:${an?0:l} ${C};stroke-dashoffset:${-s};${an?`transition:stroke-dasharray ${(sh/C*1.4+.1).toFixed(2)}s ease-out ${(s/C*1.4).toFixed(2)}s`:''}"/>`}).join('');
 const lg=e.map(([n,v],i)=>`<div><i style="background:${PC[i%PC.length]}"></i><span>${esc(n)}</span><em>%${Math.round(v/t*100)}</em></div>`).join('');
 return `<div class="card" style="margin-top:12px"><h3>Kategoriye göre dağılım</h3><div class="pie-wrap"><div class="pie"><svg viewBox="0 0 120 120">${seg}</svg><div class="c"><b>${a.length}</b><small>gider</small></div></div><div class="pl">${lg}</div></div></div>`;
}
function pieStart(){const c=document.querySelectorAll('.pie circle[data-l]');if(!c.length)return;c.forEach(x=>x.getBoundingClientRect());requestAnimationFrame(()=>requestAnimationFrame(()=>c.forEach(x=>{x.style.strokeDasharray=x.dataset.l+' '+x.dataset.c})))}
const gRow=x=>`<div class="row${NEW.has(x.id)?' new':''}" data-g="1" data-id="${x.id}"><div class="t"><b>${esc(x.kaynak)}</b><small>${esc(x.aciklama||'')}${x.aciklama?' · ':''}${dl(x.tarih)}${x.ekleyen?' · '+esc(x.ekleyen):''}</small></div><div class="a" style="color:var(--ok)">+${fmt(x.tutar)}</div></div>`;
let GM=null,GY='',GS='';
function gelirV(){
 if(GM===null){GM=curM();GY=GM.slice(0,4)}
 const ys=[...new Set(G.map(x=>x.tarih.slice(0,4)).concat(curM().slice(0,4)))].sort().reverse();
 const ks=[...new Set(G.map(x=>x.tarih.slice(0,7)).concat(curM()))].filter(k=>!GY||k.slice(0,4)===GY).sort().reverse();
 const inP=x=>(!GY||x.tarih.slice(0,4)===GY)&&(!GM||x.tarih.slice(0,7)===GM);
 const a=G.filter(x=>inP(x)&&(!GS||x.kaynak===GS)).sort((x,y)=>x.tarih<y.tarih?1:x.tarih>y.tarih?-1:0);
 const t=sum(a),ht=sum(H().filter(inP)),bs={},g={};
 a.forEach(x=>{bs[x.kaynak]=(bs[x.kaynak]||0)+x.tutar;(g[x.tarih.slice(0,7)]=g[x.tarih.slice(0,7)]||[]).push(x)});
 const src=Object.entries(bs).sort((x,y)=>y[1]-x[1]);
 const lst=GM?`<div class="list">${a.map(gRow).join('')}</div>`:Object.keys(g).sort().reverse().map(k=>`<div class="sec"><span style="text-transform:capitalize">${ml(k)}</span><span>${fmt(sum(g[k]))}</span></div><div class="list">${g[k].map(gRow).join('')}</div>`).join('');
 return `<div class="fl"><select onchange="GY=this.value;GM='';render()"><option value="">Tüm yıllar</option>${ys.map(y=>`<option ${y===GY?'selected':''}>${y}</option>`).join('')}</select><select onchange="GM=this.value;render()"><option value="">Tüm aylar</option>${ks.map(k=>`<option value="${k}" ${k===GM?'selected':''}>${ml(k)}</option>`).join('')}</select><select onchange="GS=this.value;render()"><option value="">Tüm kaynaklar</option>${catsOf(KG,G.map(x=>x.kaynak)).map(c=>`<option ${c===GS?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
 <div class="hero"><div class="m">${GM?ml(GM):(GY||'Tüm zamanlar')}${GS?' · '+esc(GS):''}</div><div class="sub" style="display:block"><small style="opacity:.65;font-size:12px">Toplam gelir</small></div><div class="big" data-v="${t}">${fmt(t)}</div><div class="sub"><div class="p"><small>Gelir kaydı</small><b>${a.length}</b></div>${ht!=null?`<div><small>Gider</small><b>${fmt(ht)}</b></div><div><small>Gelir − gider</small><b style="color:${t-ht<0?'#F6C65B':'#7BE0AE'}">${fmt(t-ht)}</b></div>`:''}</div></div>
 ${src.length>1?`<div class="card" style="margin-top:12px"><h3>Kaynaklara göre gelir</h3>${src.map(([n,v])=>`<div class="hb"><span>${esc(n)}</span><div class="tr"><i style="width:${v/src[0][1]*100}%;background:var(--ok)"></i></div><b>${fmt(v)}</b></div>`).join('')}</div>`:'<div style="height:12px"></div>'}
 ${a.length?lst:'<div class="list"><div class="empty">Bu dönemde gelir kaydı yok.</div></div>'}`;
}
function gelirH(k,ht){
 const a=G.filter(x=>x.tarih.slice(0,7)===k).sort((x,y)=>x.tarih<y.tarih?1:x.tarih>y.tarih?-1:0),gt=sum(a);
 return `<div class="card" style="margin-top:12px"><h3>Gelirler</h3><div class="g4" style="margin-bottom:10px"><div style="background:var(--bg)"><small>Toplam gelir</small><b style="color:var(--ok)">${fmt(gt)}</b></div><div style="background:var(--bg)"><small>Gelir − gider</small><b style="color:${gt-ht<0?'var(--bad)':'var(--ink)'}">${fmt(gt-ht)}</b></div></div>${a.length?`<div class="list" style="background:var(--bg)">${a.map(gRow).join('')}</div>`:'<div class="empty" style="padding:12px">Bu ay gelir eklenmedi.</div>'}</div>`;
}
function openGelir(id){
 const x=id?G.find(i=>i.id===id):null;
 F=x?{...x}:{id:'',tarih:today(),kaynak:KG.includes(USER.ad)?USER.ad:KG[0],aciklama:'',tutar:'',not:''};
 $('#ov').innerHTML=`<div class="sheet"><h2>${x?'Geliri düzenle':'Yeni gelir'}</h2>
 <label>Tutar (₺)</label><input id="g-t" class="amt" inputmode="decimal" placeholder="0" value="${F.tutar===''?'':String(F.tutar).replace('.',',')}">
 <label>Kaynak</label><div class="chips">${(x?catsOf(KG,[x.kaynak]):KG).map(c=>`<button type="button" class="${c===F.kaynak?'on':''}" onclick="pickG(this,'${c}')">${esc(c)}</button>`).join('')}</div>
 <label>Açıklama (isteğe bağlı)</label><input id="g-a" value="${esc(F.aciklama)}">
 <div class="two"><div><label>Tarih</label><input id="g-d" type="date" value="${F.tarih}" onchange="$('#g-m').value=ml(this.value.slice(0,7))"></div><div><label>Ay (otomatik)</label><input id="g-m" readonly value="${ml(F.tarih.slice(0,7))}"></div></div>
 <label>Not</label><textarea id="g-n" rows="2">${esc(F.not)}</textarea>
 <div class="act">${x?'<button class="del" onclick="delG()">Sil</button>':''}<button class="save" id="sv" onclick="saveG()">Kaydet</button></div>
 <div class="act" style="margin-top:8px"><button onclick="closeF()" style="background:var(--card);color:var(--mut)">Vazgeç</button></div></div>`;
 $('#ov').classList.add('on');if(!x)setTimeout(()=>$('#g-t').focus(),50);
}
function pickG(b,c){F.kaynak=c;b.parentNode.querySelectorAll('button').forEach(i=>i.classList.toggle('on',i===b))}
async function saveG(){
 const t=num($('#g-t').value);
 if(!(t>0)){toast('Geçerli bir tutar girin');return}
 if(!$('#g-d').value){toast('Tarih seçin');return}
 const e={id:F.id,tarih:$('#g-d').value,kaynak:F.kaynak,aciklama:$('#g-a').value.trim(),tutar:t,not:$('#g-n').value.trim()};
 $('#sv').disabled=true;$('#sv').textContent='Kaydediliyor…';
 try{
  if(e.id){await run('updateGelir',e);Object.assign(G.find(i=>i.id===e.id),e);NEW.add(e.id)}else{const r=await run('addGelir',e);G.push(r);NEW.add(r.id)}
  if(view==='gelir'){const k=e.tarih.slice(0,7);if(GM)GM=k;if(GY)GY=k.slice(0,4)}closeF();toast('Kaydedildi');render();bump('fab-g');
 }catch(er){toast('Kaydedilemedi: '+(er.message||er));$('#sv').disabled=false;$('#sv').textContent='Kaydet'}
}
async function delG(){
 const x={...G.find(i=>i.id===F.id)};
 try{await run('deleteGelir',x.id);G=G.filter(i=>i.id!==x.id);closeF();render();
  undoToast('Gelir silindi',async()=>{await run('geriYukleGelir',x);G.push(x);NEW.add(x.id);render();toast('Geri alındı')})}catch(er){toast('Silinemedi')}
}
const pcode=p=>p&&p!=='TL'?p:'';
const nf4=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:4}),nf2=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const recAmt=x=>{const c=pcode(x.para);return c?nf2.format(x.tutar)+' '+c:fmt(x.tutar)};
async function dvUpd(){
 const el=$('#f-tl');if(!el||F.id)return;
 const c=pcode(F.para),kv=$('#f-kur');el.textContent='Tutar ('+(c||'₺')+')';
 if(!c){kv.textContent='';return}
 kv.textContent='Güncel kur alınıyor…';
 try{if(!KUR[c])KUR[c]=await run('getKur',c);if(pcode(F.para)===c)dvPrev()}catch(er){if(pcode(F.para)===c)kv.textContent='Kur şu an alınamadı; kayıt sırasında tekrar denenecek.'}
}
function dvPrev(){
 const c=pcode(F.para),kv=$('#f-kur'),k=KUR[c];if(!c||F.id||!kv||!k)return;
 const t=num($('#f-t').value);
 kv.textContent='1 '+c+' = ₺'+nf4.format(k.kur)+' ('+k.kaynak+')'+(t>0?' · '+nf2.format(t)+' '+c+' ≈ '+fmt(Math.round(t*k.kur*100)/100):'');
}
function rvUpd(){const el=$('#r-tl');if(!el)return;const c=pcode(F.para);el.textContent='Tutar ('+(c||'₺')+')';$('#r-kur').textContent=c?'Tutar '+c+' cinsinden girilir; her ay gider oluşurken güncel kurla TL\'ye çevrilir ve açıklamaya yazılır.':''}
const recRow=x=>`<div class="row" onclick="openRecForm('${x.id}')"><button class="chk ${x.aktif?'on':''}" onclick="event.stopPropagation();togRec('${x.id}')" aria-label="Aktif">${x.aktif?'✓':''}</button><div class="t"><b>${esc(x.aciklama)}</b><small>${esc(x.kategori)} · her ayın ${x.gun}. günü${x.bit?' · '+ml(x.bit)+' sonuna kadar':''}${x.aktif?'':' · duraklatıldı'}</small></div><div class="a">${recAmt(x)}</div></div>`;
const recList=()=>R.length?R.map(recRow).join(''):'<div class="empty">Henüz tekrarlayan gider yok.</div>';
function openRec(){
 $('#ov').innerHTML=`<div class="sheet"><h2>Tekrarlayan giderler</h2><div class="hint" style="margin:-8px 0 12px">Kira, aidat, kredi gibi giderler her ay otomatik gider olarak eklenir. Kutuyu kapatırsan duraklar.</div><div class="list" id="rl" style="background:var(--bg)">${recList()}</div><div class="act"><button class="save" onclick="openRecForm()">+ Yeni tekrarlayan gider</button></div><div class="act" style="margin-top:8px"><button onclick="closeF()" style="background:var(--card);color:var(--mut)">Kapat</button></div></div>`;
 $('#ov').classList.add('on');
}
async function togRec(id){
 const x=R.find(i=>i.id===id);x.aktif=!x.aktif;$('#rl').innerHTML=recList();
 try{await run('setRecActive',id,x.aktif);if(x.aktif){D=await run('getAll');render()}}catch(er){x.aktif=!x.aktif;$('#rl').innerHTML=recList();toast('Kaydedilemedi')}
}
function openRecForm(id){
 const x=id?R.find(i=>i.id===id):null;
 F=x?{...x}:{id:'',kategori:KH[0],para:'TL',aktif:true};
 const ilk=x?x.bas+'-'+String(x.gun).padStart(2,'0'):today();
 const sure=x&&x.bit?(+x.bit.slice(0,4)-+x.bas.slice(0,4))*12+(+x.bit.slice(5,7)-+x.bas.slice(5,7))+1:'';

  NEW.add(r.id);closeF();render();bump('fab-e');toast('Kaydedildi');

async function delEtk(){

function anaGelir(a,bm,ks,t,cat,src){
 const inP=x=>(!A.y||x.tarih.slice(0,4)===A.y)&&(!A.m||x.tarih.slice(5,7)===A.m);
 const gi=G.filter(x=>inP(x)&&(!src||x.kaynak===src)),gt=sum(gi),ht=cat?sum(H().filter(inP)):t;

 const gc=Object.entries(gs).sort((x,y)=>y[1]-x[1]),bt=k=>bm[k]?bm[k].p+bm[k].u:0;
 let k2=ks.slice();Object.keys(gm).forEach(k=>{if(!k2.includes(k))k2.push(k)});k2.sort();

 return `<div class="sec" style="margin-top:22px"><span>Gelir analizi</span></div>${cat?'<div class="lg" style="margin:-4px 4px 10px">Gelirler gider kategorisinden bağımsız gösterilir.</div>':''}
 <div class="card"><h3>Kaynaklara göre gelir</h3>${gc.length?gc.map(([n,v])=>`<div class="hb"><span>${esc(n)}</span><div class="tr"><i style="width:${v/gc[0][1]*100}%;background:var(--ok)"></i></div><b>${fmt(v)}</b></div>`).join(''):'<div class="empty">Veri yok</div>'}</div>
 ${kisiH(gi,'Kişiye göre gelir (kaydı giren)','var(--ok)')}<div class="card"><h3>Aylara göre gelir ve gider</h3>${k2.length?`<div class="mc">${cols}</div><div class="lg"><span><s style="background:var(--ok)"></s>Gelir</span><span><s style="background:var(--ink)"></s>Gider</span></div>`:'<div class="empty">Veri yok</div>'}</div>

function anaH(){
 const ys=[...new Set(H().concat(G).map(x=>x.tarih.slice(0,4)))].sort().reverse();
 const sg=A.c.startsWith('g:'),cat=sg?'':A.c,src=sg?A.c.slice(2):'';
 const a=H().filter(x=>(!A.y||x.tarih.slice(0,4)===A.y)&&(!A.m||x.tarih.slice(5,7)===A.m)&&(!cat||x.kategori===cat));
 const t=sum(a),p=sum(a.filter(x=>x.odendi)),u=t-p;
 const inP=x=>(!A.y||x.tarih.slice(0,4)===A.y)&&(!A.m||x.tarih.slice(5,7)===A.m),gTot=sum(G.filter(x=>inP(x)&&(!src||x.kaynak===src))),tAll=cat?sum(H().filter(inP)):t;
 const bc={};a.forEach(x=>bc[x.kategori]=(bc[x.kategori]||0)+x.tutar);
 const cats=Object.entries(bc).sort((x,y)=>y[1]-x[1]);
 const bm={};a.forEach(x=>{const k=x.tarih.slice(0,7);(bm[k]=bm[k]||{p:0,u:0})[x.odendi?'p':'u']+=x.tutar});
 let ks=Object.keys(bm).sort();
 if(A.y&&!A.m)ks=MN.map((_,i)=>A.y+'-'+String(i+1).padStart(2,'0'));
 const mx=Math.max(1,...ks.map(k=>(bm[k]?bm[k].p+bm[k].u:0)));
 const per=[A.y||'Tüm yıllar',A.m?MN[+A.m-1]:'Tüm aylar',(A.c?A.c.replace(/^g:/,''):'Tüm kategoriler')].join(' · ');
 const pp=t?Math.round(p/t*100):0;
 const cols=ks.map(k=>{const v=bm[k]||{p:0,u:0},d=new Date(k.slice(0,4),k.slice(5,7)-1,1);
  return `<div class="c"><span>${kf(v.p+v.u)}</span><div class="st"><i style="height:${v.u/mx*110}px;background:var(--warn)"></i><i style="height:${v.p/mx*110}px;background:var(--ok)"></i></div><span>${d.toLocaleDateString('tr-TR',{month:'short'})}</span><span>'${k.slice(2,4)}</span></div>`}).join('');
 return `<div class="fl"><select onchange="A.y=this.value;render()"><option value="">Tüm yıllar</option>${ys.map(y=>`<option ${y===A.y?'selected':''}>${y}</option>`).join('')}</select><select onchange="A.m=this.value;render()"><option value="">Tüm aylar</option>${MN.map((n,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}" ${v===A.m?'selected':''}>${n}</option>`}).join('')}</select><select onchange="A.c=this.value;render()"><option value="">Tüm kategoriler</option>${catsOf(KH,H().map(x=>x.kategori)).map(c=>`<option ${c===A.c?'selected':''}>${c}</option>`).join('')}<optgroup label="Gelir kaynakları">${catsOf(KG,G.map(x=>x.kaynak)).map(c=>`<option value="g:${esc(c)}" ${A.c==='g:'+c?'selected':''}>${esc(c)}</option>`).join('')}</optgroup></select></div>
 <div class="hero"><div class="m">${esc(per)}</div><div class="sub" style="display:block"><small style="opacity:.65;font-size:12px">Toplam gider</small></div><div class="big" data-v="${t}">${fmt(t)}</div><div class="sub"><div class="p"><small>Toplam gelir</small><b>${fmt(gTot)}</b></div><div><small>Gelir − gider</small><b style="color:${gTot-tAll<0?'#F6C65B':'#7BE0AE'}">${fmt(gTot-tAll)}</b></div></div></div><div style="height:12px"></div>
 <div class="card"><h3>Kategorilere göre gider</h3>${cats.length?cats.map(([n,v])=>`<div class="hb"><span>${esc(n)}</span><div class="tr"><i style="width:${v/cats[0][1]*100}%"></i></div><b>${fmt(v)}</b></div>`).join(''):'<div class="empty">Veri yok</div>'}</div>
 ${kisiH(a,'Kişiye göre gider (kaydı giren)')}<div class="card"><h3>Aylara göre gider</h3>${ks.length?`<div class="mc">${cols}</div><div class="lg"><span><s style="background:var(--ok)"></s>Ödenen</span><span><s style="background:var(--warn)"></s>Ödenmemiş</span></div>`:'<div class="empty">Veri yok</div>'}</div>
 <div class="card"><h3>Ödenen / ödenmemiş</h3><div class="bar" style="background:var(--warn);height:14px;border-radius:7px"><i style="width:${pp}%;background:var(--ok)"></i></div><div class="lg" style="justify-content:space-between"><span><s style="background:var(--ok)"></s>Ödenen %${pp}</span><span><s style="background:var(--warn)"></s>Ödenmemiş %${t?100-pp:0}</span></div></div>
 <div class="g4"><div><small>Toplam gider</small><b>${fmt(t)}</b></div><div><small>Ödenen</small><b style="color:var(--ok)">${fmt(p)}</b></div><div><small>Ödenmemiş</small><b style="color:var(--warn)">${fmt(u)}</b></div><div><small>Gider sayısı</small><b>${a.length}</b></div></div>${anaGelir(a,bm,ks,t,cat,src)}`;
}
function tkH(){
 const all=D.filter(x=>x.tk).sort((x,y)=>x.tarih<y.tarih?-1:x.tarih>y.tarih?1:0);
 const ks=[...new Set(all.map(x=>x.tarih.slice(0,7)))];
 const b=all.filter(x=>(!TF.m||x.tarih.slice(0,7)===TF.m)&&(!TF.c||x.kategori===TF.c));
 const t=sum(b),p=sum(b.filter(x=>x.odendi)),u=t-p;
 const L=b.filter(x=>TF.s==='a'||(TF.s==='p')===x.odendi);
 const grp=l=>{const g={};l.forEach(x=>(g[x.tarih.slice(0,7)]=g[x.tarih.slice(0,7)]||[]).push(x));return Object.keys(g).map(k=>`<div class="sec"><span style="text-transform:capitalize">${ml(k)}</span><span>${fmt(sum(g[k]))}</span></div><div class="list">${g[k].map(rowH).join('')}</div>`).join('')};
 const part=(c,n,l)=>l.length?`<div class="part ${c}">${n} · ${l.length}</div>${grp(l)}`:'';
 const body=TF.s==='a'?part('u','Ödenmemiş',L.filter(x=>!x.odendi))+part('p','Ödenen',L.filter(x=>x.odendi)):grp(L);
 const ST=[['u','Ödenmemiş'],['p','Ödenen'],['a','Tümü']];
 return `<div class="fl"><select onchange="TF.m=this.value;render()"><option value="">Tüm aylar</option>${ks.map(k=>`<option value="${k}" ${k===TF.m?'selected':''}>${ml(k)}</option>`).join('')}</select><select onchange="TF.c=this.value;render()"><option value="">Tüm kategoriler</option>${catsOf(KT,D.filter(x=>x.tk).map(x=>x.kategori)).map(c=>`<option ${c===TF.c?'selected':''}>${c}</option>`).join('')}</select><select onchange="TF.s=this.value;render()">${ST.map(([v,n])=>`<option value="${v}" ${v===TF.s?'selected':''}>${n}</option>`).join('')}</select></div>
 <div class="hero"><div class="m">${TF.m?ml(TF.m):'Tüm taksitler'}${TF.c?' · '+esc(TF.c):''}</div><div class="big" data-v="${t}">${fmt(t)}</div><div class="bar"><i style="width:${t?Math.round(p/t*100):0}%"></i></div><div class="sub"><div class="p"><small>Ödenen</small><b>${fmt(p)}</b></div><div class="u"><small>Ödenmemiş</small><b>${fmt(u)}</b></div><div><small>Taksit</small><b>${b.length}</b></div></div></div>
 ${L.length?body:`<div class="empty">${all.length?'Bu filtrede taksit yok.':'Taksit yok. "+ Taksit ekle" ile başlayın.'}</div>`}`;
}
function openTk(){
 F={kategori:KT.includes('Alışveriş')?'Alışveriş':KT[0]};
 $('#ov').innerHTML=`<div class="sheet"><h2>Taksit ekle</h2>
 <label>Alışveriş / açıklama</label><input id="k-a" placeholder="Örn. iPhone">
 <label>Kategori</label><div class="chips">${KT.map(c=>`<button type="button" class="${c===F.kategori?'on':''}" onclick="pick(this,'${c}')">${c}</button>`).join('')}</div>
 <div class="two"><div><label>Toplam tutar (₺)</label><input id="k-t" inputmode="decimal" placeholder="0" oninput="pv()"></div><div><label>Taksit sayısı</label><input id="k-n" type="number" min="1" max="60" inputmode="numeric" value="3" oninput="pv()"></div></div>
 <div id="k-pv" style="margin-top:8px;font-weight:600;color:var(--mut)"></div>
 <label>İlk taksit tarihi</label><input id="k-d" type="date" value="${today()}">
 <label>Not</label><textarea id="k-nt" rows="2"></textarea>
 <div class="act"><button class="save" id="sv" onclick="saveTk()">Taksitleri oluştur</button></div>
 <div class="act" style="margin-top:8px"><button onclick="closeF()" style="background:var(--card);color:var(--mut)">Vazgeç</button></div></div>`;
 $('#ov').classList.add('on');pv();
}
const num=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'));
function pv(){const t=num($('#k-t').value),n=parseInt($('#k-n').value);$('#k-pv').textContent=t>0&&n>0?n+' x '+fmt(Math.round(t/n*100)/100)+' (aylık)':''}
async function saveTk(){
 const t=num($('#k-t').value),n=parseInt($('#k-n').value);
 if(!($('#k-a').value.trim())){toast('Açıklama girin');return}
 if(!(t>0)){toast('Geçerli bir tutar girin');return}
 if(!(n>=1&&n<=60)){toast('Taksit sayısı 1-60 olmalı');return}
 if(!$('#k-d').value){toast('İlk taksit tarihini seçin');return}
 $('#sv').disabled=true;$('#sv').textContent='Oluşturuluyor…';
 try{const r=await run('addTaksit',{aciklama:$('#k-a').value.trim(),kategori:F.kategori,toplam:t,adet:n,ilk:$('#k-d').value,not:$('#k-nt').value.trim()});
  D=D.concat(r);r.forEach(x=>NEW.add(x.id));closeF();view='tk';render();bump('fab-t');toast(n+' taksit oluşturuldu')}
 catch(er){toast('Kaydedilemedi: '+(er.message||er));$('#sv').disabled=false;$('#sv').textContent='Taksitleri oluştur'}
}
function openTkDetail(x){
 F={...x};const tot=sum(D.filter(i=>i.ana===x.ana));
 $('#ov').innerHTML=`<div class="sheet"><h2>${esc(x.aciklama)}</h2>
 <div class="list" style="background:var(--bg)"><div class="row" style="cursor:default"><div class="t"><b>${x.no}/${x.top}. taksit</b><small>Vade: ${dl(x.tarih)} ${x.tarih.slice(0,4)} · ${esc(x.kategori)}</small></div><div class="a">${fmt(x.tutar)}</div></div></div>
 <div style="margin-top:8px;color:var(--mut);font-size:13px">Toplam alışveriş: ${fmt(tot)}</div>
 <label class="paidrow"><input id="f-p" type="checkbox" ${x.odendi?'checked':''}> Ödendi</label>
 <label>Not</label><textarea id="f-n" rows="2">${esc(x.not)}</textarea>
 <div class="act"><button class="del" onclick="delPlan()">Planı sil</button><button class="save" id="sv" onclick="saveTkD()">Kaydet</button></div>
 <div class="act" style="margin-top:8px"><button onclick="closeF()" style="background:var(--card);color:var(--mut)">Vazgeç</button></div></div>`;
 $('#ov').classList.add('on');
}
async function saveTkD(){
 const x=D.find(i=>i.id===F.id),n=$('#f-n').value.trim(),p=$('#f-p').checked;
 $('#sv').disabled=true;
 try{await run('updateTk',x.id,n,p);x.not=n;x.odendi=p;closeF();render();toast('Kaydedildi')}catch(er){toast('Kaydedilemedi');$('#sv').disabled=false}
}
async function delPlan(){
 if(!confirm('Bu alışverişin tüm taksitleri silinsin mi?'))return;
 const items=D.filter(i=>i.ana===F.ana).map(x=>({...x}));
 try{await run('deletePlan',F.ana);D=D.filter(i=>i.ana!==F.ana);closeF();render();
  undoToast('Taksit planı silindi',async()=>{await run('geriYukleTaksit',items);D=D.concat(items);items.forEach(x=>NEW.add(x.id));render();toast('Geri alındı')})}catch(er){toast('Silinemedi')}
}
Promise.all([run('getAll'),run('getGelirler').catch(()=>[]),run('getCategories').catch(()=>null),run('getUser').catch(()=>({ad:''})),run('getRecs').catch(()=>[]),run('getParaBirimleri').catch(()=>null),run('getAbonelikler').catch(()=>null),run('getEtkinlikler').catch(()=>null)]).then(([r,g,c,u,rc,pb,ab,et])=>{if(et){ET=et.items;EG=et.giderler}D=r;G=g;R=rc||[];if(pb&&pb.length)PB=pb;if(ab){ABO=ab.items;AH=ab.hist;AKUR=ab.kur||{}}USER=u||USER;if(c){if(c[0].length)KH=c[0];if(c[1].length)KT=c[1];if(c[2].length)KG=c[2];if(c[3]&&c[3].length)KE=c[3]}render()}).catch(er=>{$('#app').innerHTML='<div class="empty">'+(String(er.message||er).includes('YETKISIZ')?'Erişim yetkiniz yok.':'Veriler yüklenemedi: '+esc(er.message||er))+'</div>'});
</script>
